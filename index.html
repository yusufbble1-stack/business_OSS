<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AS Performance Chiptuning — Business OS</title>
  <meta name="description" content="Business operating system for AS Performance Chiptuning. Manage file requests, customers, and technician workflows." />
  <meta name="theme-color" content="#0D0D0D" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://payhip.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://openrouter.ai https://*.supabase.co https://www.googleapis.com https://accounts.google.com https://unpkg.com; img-src 'self' data: blob: https:; frame-src https://accounts.google.com https://payhip.com;" />
  <link rel="icon" type="image/png" href="/assets/logo.png" />
  <link rel="apple-touch-icon" href="/assets/logo.png" />
  <style>
    body { margin: 0; background: #000; }
    body.preloader-active { overflow: hidden; }
    /* ===== Video Preloader ===== */
    #app-preloader {
      position: fixed; inset: 0; z-index: 99999;
      display: flex; align-items: center; justify-content: center;
      background: #000;
      transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #app-preloader.preloader-done {
      opacity: 0;
      pointer-events: none;
    }
    #preload-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      opacity: 0;
      transform: scale(1.02);
      transition: opacity 0.6s ease, transform 0.6s ease;
      z-index: 1;
    }
    #preload-video.video-visible {
      opacity: 1;
      transform: scale(1);
    }

    /* ===== Red Lightning Corner Effects ===== */
    .preloader-lightning {
      position: absolute;
      width: 260px;
      height: 260px;
      z-index: 10;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    #app-preloader.lightning-active .preloader-lightning {
      opacity: 1;
    }
    .preloader-lightning svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 8px rgba(196, 30, 30, 0.8))
             drop-shadow(0 0 25px rgba(230, 57, 70, 0.5))
             drop-shadow(0 0 50px rgba(196, 30, 30, 0.3));
    }
    .lightning-tl { top: 0; left: 0; }
    .lightning-tr { top: 0; right: 0; transform: scaleX(-1); }
    .lightning-bl { bottom: 0; left: 0; transform: scaleY(-1); }
    .lightning-br { bottom: 0; right: 0; transform: scale(-1, -1); }

    /* Lightning flicker animation — each corner has a different timing */
    .lightning-tl { animation: lightningFlicker1 3s ease-in-out infinite; }
    .lightning-tr { animation: lightningFlicker2 2.5s ease-in-out infinite 0.3s; }
    .lightning-bl { animation: lightningFlicker3 2.8s ease-in-out infinite 0.7s; }
    .lightning-br { animation: lightningFlicker4 3.2s ease-in-out infinite 0.5s; }

    @keyframes lightningFlicker1 {
      0%, 100% { opacity: 0.3; }
      5% { opacity: 1; }
      8% { opacity: 0.2; }
      12% { opacity: 0.9; }
      15% { opacity: 0.4; }
      50% { opacity: 0.5; }
      52% { opacity: 1; }
      55% { opacity: 0.3; }
    }
    @keyframes lightningFlicker2 {
      0%, 100% { opacity: 0.25; }
      10% { opacity: 0.8; }
      13% { opacity: 0.15; }
      16% { opacity: 1; }
      20% { opacity: 0.35; }
      60% { opacity: 0.6; }
      63% { opacity: 1; }
      66% { opacity: 0.2; }
    }
    @keyframes lightningFlicker3 {
      0%, 100% { opacity: 0.35; }
      20% { opacity: 0.9; }
      23% { opacity: 0.1; }
      25% { opacity: 1; }
      30% { opacity: 0.3; }
      70% { opacity: 0.7; }
      72% { opacity: 1; }
      75% { opacity: 0.25; }
    }
    @keyframes lightningFlicker4 {
      0%, 100% { opacity: 0.2; }
      15% { opacity: 1; }
      18% { opacity: 0.3; }
      22% { opacity: 0.85; }
      25% { opacity: 0.15; }
      45% { opacity: 0.55; }
      48% { opacity: 1; }
      52% { opacity: 0.3; }
    }

    /* Subtle red corner glow behind lightning */
    .preloader-corner-glow {
      position: absolute;
      width: 300px;
      height: 300px;
      z-index: 5;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    #app-preloader.lightning-active .preloader-corner-glow {
      opacity: 1;
    }
    .glow-tl { top: -50px; left: -50px; background: radial-gradient(circle, rgba(196,30,30,0.2) 0%, transparent 70%); animation: glowPulse 3s ease-in-out infinite; }
    .glow-tr { top: -50px; right: -50px; background: radial-gradient(circle, rgba(230,57,70,0.15) 0%, transparent 70%); animation: glowPulse 2.5s ease-in-out infinite 0.4s; }
    .glow-bl { bottom: -50px; left: -50px; background: radial-gradient(circle, rgba(196,30,30,0.18) 0%, transparent 70%); animation: glowPulse 2.8s ease-in-out infinite 0.8s; }
    .glow-br { bottom: -50px; right: -50px; background: radial-gradient(circle, rgba(230,57,70,0.15) 0%, transparent 70%); animation: glowPulse 3.2s ease-in-out infinite 0.6s; }

    @keyframes glowPulse {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.15); }
    }

    /* Fallback spinner — only shown if video fails */
    #app-preloader .loader-fallback {
      display: none;
      width: 40px; height: 40px;
      border: 3px solid #2A2A2A; border-top-color: #C41E1E;
      border-radius: 50%; animation: loader-spin 0.7s linear infinite;
    }
    #app-preloader.video-error .loader-fallback { display: block; }
    #app-preloader.video-error #preload-video { display: none; }
    @keyframes loader-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- Video Preloader -->
  <div id="app-preloader">
    <!-- Corner Glow Effects -->
    <div class="preloader-corner-glow glow-tl"></div>
    <div class="preloader-corner-glow glow-tr"></div>
    <div class="preloader-corner-glow glow-bl"></div>
    <div class="preloader-corner-glow glow-br"></div>

    <!-- Red Lightning — Top Left -->
    <div class="preloader-lightning lightning-tl">
      <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M0 0 L45 55 L25 50 L70 110 L40 100 L85 170 L55 155 L90 200" stroke="url(#lg1)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
        <path d="M15 0 L55 45 L38 42 L75 95 L50 88 L80 145" stroke="url(#lg1)" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
        <path d="M0 20 L30 60 L18 55 L50 100 L35 95 L60 140" stroke="url(#lg1)" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>
        <path d="M5 0 L20 30 L12 28 L35 65" stroke="url(#lg1)" stroke-width="1" stroke-linecap="round" opacity="0.35"/>
        <defs>
          <linearGradient id="lg1" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ff2020" stop-opacity="1"/>
            <stop offset="40%" stop-color="#C41E1E" stop-opacity="0.8"/>
            <stop offset="100%" stop-color="#8b0000" stop-opacity="0.3"/>
          </linearGradient>
        </defs>
      </svg>
    </div>

    <!-- Red Lightning — Top Right -->
    <div class="preloader-lightning lightning-tr">
      <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M0 0 L50 60 L30 55 L75 120 L45 108 L90 180 L60 162 L95 200" stroke="url(#lg2)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
        <path d="M20 0 L60 50 L42 46 L80 100 L55 93 L85 150" stroke="url(#lg2)" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
        <path d="M0 15 L35 65 L22 58 L55 110 L38 100 L65 145" stroke="url(#lg2)" stroke-width="1.8" stroke-linecap="round" opacity="0.55"/>
        <defs>
          <linearGradient id="lg2" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ff3030" stop-opacity="1"/>
            <stop offset="45%" stop-color="#E63946" stop-opacity="0.75"/>
            <stop offset="100%" stop-color="#8b0000" stop-opacity="0.25"/>
          </linearGradient>
        </defs>
      </svg>
    </div>

    <!-- Red Lightning — Bottom Left -->
    <div class="preloader-lightning lightning-bl">
      <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M0 0 L42 50 L22 46 L68 105 L38 96 L82 165 L52 150 L88 200" stroke="url(#lg3)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
        <path d="M10 0 L48 42 L32 40 L72 88 L48 82 L78 135" stroke="url(#lg3)" stroke-width="1.5" stroke-linecap="round" opacity="0.45"/>
        <path d="M0 25 L28 58 L16 54 L48 95 L32 90 L58 130" stroke="url(#lg3)" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>
        <defs>
          <linearGradient id="lg3" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ff2525" stop-opacity="1"/>
            <stop offset="50%" stop-color="#C41E1E" stop-opacity="0.7"/>
            <stop offset="100%" stop-color="#8b0000" stop-opacity="0.2"/>
          </linearGradient>
        </defs>
      </svg>
    </div>

    <!-- Red Lightning — Bottom Right -->
    <div class="preloader-lightning lightning-br">
      <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M0 0 L48 58 L28 52 L72 115 L42 105 L88 175 L58 160 L92 200" stroke="url(#lg4)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
        <path d="M18 0 L55 48 L38 44 L78 96 L52 90 L82 142" stroke="url(#lg4)" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
        <path d="M0 18 L32 62 L20 56 L52 105 L36 96 L62 138" stroke="url(#lg4)" stroke-width="1.8" stroke-linecap="round" opacity="0.55"/>
        <defs>
          <linearGradient id="lg4" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ff2828" stop-opacity="1"/>
            <stop offset="40%" stop-color="#E63946" stop-opacity="0.8"/>
            <stop offset="100%" stop-color="#8b0000" stop-opacity="0.3"/>
          </linearGradient>
        </defs>
      </svg>
    </div>

    <video id="preload-video" autoplay muted playsinline preload="auto">
      <source src="/videos/preload.mp4" type="video/mp4">
    </video>
    <div class="loader-fallback"></div>
  </div>

  <div id="app"></div>
  <!-- Payhip Embed Script — enables overlay checkout popups -->
  <script src="https://payhip.com/payhip.js"></script>
  <script type="module" src="/src/main.js"></script>
  <script>
    (function() {
      const preloader = document.getElementById('app-preloader');
      const video = document.getElementById('preload-video');
      let dismissed = false;

      // Lock scroll during preloader
      document.body.classList.add('preloader-active');

      function dismissPreloader() {
        if (dismissed) return;
        dismissed = true;
        video.pause();
        document.body.classList.remove('preloader-active');
        preloader.classList.add('preloader-done');
        setTimeout(() => { preloader.remove(); }, 900);
      }

      // Show video + lightning once it starts playing
      video.addEventListener('playing', function onPlaying() {
        video.removeEventListener('playing', onPlaying);
        video.classList.add('video-visible');
        preloader.classList.add('lightning-active');

        // Play sound via separate Audio element (video stays muted for autoplay)
        var audio = new Audio('/videos/preload.mp4');
        audio.currentTime = video.currentTime;
        audio.play().catch(function() { /* browser blocked audio, that's ok */ });
      });

      // Dismiss when video ends
      video.addEventListener('ended', () => {
        setTimeout(dismissPreloader, 200);
      });

      // Fallback if video fails
      video.addEventListener('error', () => {
        preloader.classList.add('video-error');
        setTimeout(dismissPreloader, 1500);
      });

      // Safety net
      setTimeout(dismissPreloader, 10000);
    })();
  </script>
</body>
</html>
